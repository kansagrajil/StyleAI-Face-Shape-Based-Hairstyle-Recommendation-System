<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Log in to your StyleAI account to access personalized hairstyle recommendations.">
    <title>Log In — StyleAI</title>
    
    <!-- Bootstrap 5 & Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom Tokens & Component Styles -->
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="d-flex flex-column min-vh-100">
    
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg fixed-top glass-navbar" id="navbar">
        <div class="container-fluid px-4">
            <a href="/" class="navbar-brand d-flex align-items-center gap-2">
                <span class="logo-icon fs-4">✂️</span>
                <span class="fw-bold fs-4">Style<span class="text-gradient">AI</span></span>
            </a>

            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navContent">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0 gap-lg-3 fw-medium">
                    <li class="nav-item"><a href="/" class="nav-link">Home</a></li>
                    <li class="nav-item"><a href="/pages/analyze.html" class="nav-link">Analyze Face</a></li>
                    <li class="nav-item"><a href="/pages/dashboard.html" class="nav-link">Dashboard</a></li>
                    <li class="nav-item"><a href="/pages/history.html" class="nav-link">History</a></li>
                    <li class="nav-item"><a href="/pages/about.html" class="nav-link">About AI</a></li>
                </ul>

                <div class="d-flex align-items-center gap-2" id="navAuth">
                    <a href="/pages/login.html" class="btn btn-outline-light btn-sm rounded-pill px-3 active" id="navLoginBtn">Log In</a>
                    <a href="/pages/register.html" class="btn btn-primary btn-sm rounded-pill px-4" id="navRegisterBtn">Sign Up</a>
                    <div class="d-none d-flex align-items-center gap-2" id="navUserMenu">
                        <a href="/pages/profile.html" id="navUserName" class="btn btn-outline-light btn-sm rounded-pill">👤 Account</a>
                        <button class="btn btn-outline-danger btn-sm rounded-pill" onclick="AppAuth.logout()">Logout</button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="page-content my-auto py-5">
        <div class="container max-w-450 mt-5">
            <div class="glass-card p-4 p-md-5 border-gradient shadow-2xl animate-fade-in-up">
                <div class="text-center mb-4">
                    <div class="fs-1 mb-2">✨</div>
                    <h2 class="h3 fw-bold mb-1">Welcome Back</h2>
                    <p class="text-muted small">Log in to view your personalized recommendations</p>
                </div>

                <form id="loginForm" onsubmit="AppAuth.login(event)" class="needs-validation">
                    <div class="mb-3">
                        <label class="form-label small text-muted" for="loginEmail">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark-subtle border-secondary"><i class="bi bi-envelope"></i></span>
                            <input class="form-control" type="email" id="loginEmail" placeholder="you@example.com" required autocomplete="email">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small text-muted" for="loginPassword">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark-subtle border-secondary"><i class="bi bi-lock"></i></span>
                            <input class="form-control" type="password" id="loginPassword" placeholder="••••••••" required autocomplete="current-password">
                            <button type="button" class="btn btn-outline-secondary" onclick="togglePasswordVisibility('loginPassword', this)">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div id="loginError" class="alert alert-danger d-none py-2 small mb-3"></div>

                    <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill py-3 shadow-lg" id="loginSubmitBtn">
                        Log In <i class="bi bi-arrow-right-short ms-1"></i>
                    </button>
                </form>

                <hr class="my-4 border-white-10">

                <div class="text-center small text-muted">
                    Don't have an account? <a href="/pages/register.html" class="text-primary fw-medium text-decoration-none">Sign up free →</a>
                </div>
            </div>
        </div>
    </main>

    <!-- Toast Container -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer" style="z-index: 1080;"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/app.js"></script>
    <script>
        function togglePasswordVisibility(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'bi bi-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'bi bi-eye';
            }
        }
    </script>
</body>
</html>
