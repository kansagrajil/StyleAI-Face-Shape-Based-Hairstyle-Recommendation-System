<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="User Profile & Settings — StyleAI Face Shape Hairstyle Recommender">
    <title>My Profile — StyleAI</title>

    <!-- Bootstrap 5 & Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom Styles -->
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg fixed-top glass-navbar" id="navbar">
        <div class="container-fluid px-4">
            <a href="/" class="navbar-brand d-flex align-items-center gap-2">
                <span class="logo-icon fs-4">✂️</span>
                <span class="fw-bold fs-4">Style<span class="text-gradient">AI</span></span>
            </a>

            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navContent">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0 gap-lg-3 fw-medium">
                    <li class="nav-item"><a href="/" class="nav-link">Home</a></li>
                    <li class="nav-item"><a href="/pages/analyze.html" class="nav-link">Analyze Face</a></li>
                    <li class="nav-item"><a href="/pages/dashboard.html" class="nav-link">Dashboard</a></li>
                    <li class="nav-item"><a href="/pages/history.html" class="nav-link">History</a></li>
                    <li class="nav-item"><a href="/pages/about.html" class="nav-link">About AI</a></li>
                </ul>

                <div class="d-flex align-items-center gap-2" id="navAuth">
                    <a href="/pages/login.html" class="btn btn-outline-light btn-sm rounded-pill px-3" id="navLoginBtn">Log In</a>
                    <a href="/pages/register.html" class="btn btn-primary btn-sm rounded-pill px-4" id="navRegisterBtn">Sign Up</a>
                    <div class="d-none d-flex align-items-center gap-2" id="navUserMenu">
                        <a href="/pages/profile.html" id="navUserName" class="btn btn-outline-light btn-sm rounded-pill active">👤 Account</a>
                        <button class="btn btn-outline-danger btn-sm rounded-pill" onclick="AppAuth.logout()">Logout</button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="page-content pt-5">
        <div class="container max-w-700 py-5">
            <div class="glass-card p-4 p-md-5 border-gradient shadow-2xl animate-fade-in-up">
                <div class="d-flex align-items-center gap-3 mb-4">
                    <div class="fs-1 text-primary"><i class="bi bi-person-circle"></i></div>
                    <div>
                        <h1 class="h3 fw-bold mb-0" id="profileDisplayName">User Profile</h1>
                        <p class="text-muted small mb-0" id="profileDisplayEmail">Manage your styling preferences and account settings</p>
                    </div>
                </div>

                <form id="profileForm" onsubmit="AppProfile.saveProfile(event)" class="needs-validation">
                    <h2 class="h5 fw-bold text-gradient mb-3"><i class="bi bi-sliders me-2"></i>Hair Styling Preferences</h2>
                    
                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label small text-muted">Gender Category</label>
                            <select class="form-select border-secondary bg-dark-subtle" id="profGender">
                                <option value="female">Female</option>
                                <option value="male">Male</option>
                                <option value="other">Other / Unisex</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label small text-muted">Natural Hair Type</label>
                            <select class="form-select border-secondary bg-dark-subtle" id="profHairType">
                                <option value="">Select Hair Type...</option>
                                <option value="straight">Straight</option>
                                <option value="wavy">Wavy</option>
                                <option value="curly">Curly</option>
                                <option value="coily">Coily</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label small text-muted">Preferred Hair Length</label>
                            <select class="form-select border-secondary bg-dark-subtle" id="profHairLength">
                                <option value="">Select Length...</option>
                                <option value="short">Short</option>
                                <option value="medium">Medium</option>
                                <option value="long">Long</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label small text-muted">Style Goal Focus</label>
                            <input type="text" class="form-control" id="profStylePref" placeholder="e.g. Layered, Low Maintenance, Professional">
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-3">
                        <button type="submit" class="btn btn-primary rounded-pill px-4 shadow-sm" id="profSaveBtn">
                            <i class="bi bi-check-lg me-1"></i>Save Preferences
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer border-top border-white-10 py-4 text-center text-muted small mt-auto">
        <div class="container">© 2026 StyleAI — Face Shape Based Hairstyle Recommendation System</div>
    </footer>

    <!-- Toast Container -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer" style="z-index: 1080;"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/profile.js"></script>
</body>
</html>
