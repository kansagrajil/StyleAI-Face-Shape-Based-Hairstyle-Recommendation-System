version: '3.8'

services:
  # Flask WSGI Application Service
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - FLASK_ENV=production
      - MONGO_URI=mongodb://db:27017/faceshape
      - SECRET_KEY=${SECRET_KEY:-prod-secret-key-change-me}
      - JWT_SECRET=${JWT_SECRET:-prod-jwt-secret-change-me}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - uploads_data:/app/server/uploads
      - logs_data:/app/logs
    depends_on:
      - db
    expose:
      - "5000"

  # MongoDB Database Service
  db:
    image: mongo:7.0
    restart: always
    volumes:
      - mongo_data:/data/db
    expose:
      - "27017"

  # Nginx Reverse Proxy Service
  proxy:
    image: nginx:1.25-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
      - ./client:/usr/share/nginx/html:ro
      - uploads_data:/usr/share/nginx/html/uploads:ro
      - certbot_data:/etc/letsencrypt
    depends_on:
      - web

volumes:
  mongo_data:
  uploads_data:
  logs_data:
  certbot_data:
