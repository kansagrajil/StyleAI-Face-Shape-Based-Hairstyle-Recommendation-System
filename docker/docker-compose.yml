version: "3.9"

services:
  # ── Flask Application ─────────────────────────────────────────
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: styleai-app
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - MONGO_URI=mongodb://mongo:27017/faceshape
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - JWT_SECRET=${JWT_SECRET:-dev-jwt-secret-change-me}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-change-me}
      - UPLOAD_FOLDER=server/uploads
    volumes:
      - ../server:/app/server
      - ../client:/app/client
      - uploads_data:/app/server/uploads
    depends_on:
      mongo:
        condition: service_started
    restart: unless-stopped
    networks:
      - styleai-network

  # ── MongoDB ───────────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: styleai-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    networks:
      - styleai-network

  # ── Nginx Reverse Proxy ───────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: styleai-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ../client:/usr/share/nginx/html:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - styleai-network

volumes:
  mongo_data:
    driver: local
  uploads_data:
    driver: local

networks:
  styleai-network:
    driver: bridge
